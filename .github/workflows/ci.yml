name: CI
# The runner image is pinned to ubuntu-24.04 rather than ubuntu-latest: ubuntu-latest
# moves to Ubuntu 26, and the Rust job's apt packages are version-sensitive. 24.04 is
# also the image the installers are actually built on (release.yml,
# unsigned-artifacts.yml), so this job validates the image we ship from. Bump all
# three workflows together.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: Typecheck, unit tests, website
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm ci --prefix website
      # `npm run build` typechecks (tsc --noEmit) and writes dist/, which
      # tests/bundle.test.mjs reads.
      - run: npm run build
      - run: npm test
      - run: npm run test:release
      - run: npm run site:build

  rust:
    name: Rust check and tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: npm }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf xvfb dbus-x11 xdg-utils poppler-utils
      # Tauri embeds the built frontend, so dist/ must exist before cargo runs.
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      # The gateway sits behind an off-by-default feature, so these two steps are
      # what compiles src-tauri/src/gateway/** and tests/gateway_http.rs in CI.
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features gateway --test gateway_http
      - if: ${{ !cancelled() }}
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - if: ${{ !cancelled() }}
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --features gateway --all-targets -- -D warnings
